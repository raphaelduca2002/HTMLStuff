<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima APP</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">

        <div class="search-box">
            <i class="fa-solid fa-location-dot" style="color: gold;"></i>
            <input type="text" placeholder="Pesquise uma Cidade..." class="searchbar">
            <button class="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="not-found">
            <img src="imgs/404.png" alt="404_not_found" class="illustration404">
        </div> 

        <div class="weather-box">
            <img src="" alt="" srcset="">
            <p class="temperatura"></p>
            <p class="descricao"></p>
        </div>

        <div class="weather-details">
            <div class="umidade">
                <i class="fa-solid fa-water"></i>
                <div class="text">
                    <span></span>
                    <p>Umidade</p>
                </div>
            </div>

            <div class="vento">
                <i class="fa-solid fa-wind"></i>
                <div class="text">
                    <span></span>
                    <p>Velocidade do Vento</p>
                </div>
            </div>
        </div>

    </div>
    <script src="js/app.js"></script>
    <script src="https://kit.fontawesome.com/c7bcd5f448.js" crossorigin="anonymous"></script>
</body>

</html>
