<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Jogo da Memória</title>
</head>

<body>

    <h1>Jogo da Memória</h1>
    <div class="container">

        <div class="tabuleiro" id="tabuleiro"></div>
        <div class="painel">

            <h2>Placar</h2>
            <p id="tentativas">Tentativas: <span>0</span></p>
            <p id="acertos">Acertos: <span>0</span></p>
            <p id="erros">Erros: <span>0</span></p>
            
            <div class="botoes">
                <button id="btnReiniciar">Reiniciar Jogo</button>
                <button id="btnNovoJogo">Novo Jogo</button>
            </div>

        </div>

    </div>

    <script src="js/script.js"></script>
</body>

</html>
